services:
  mysql:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-word_games}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpass}", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j:
    build: ./neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_directories_import: /import
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  neo4j-seed:
    build: ./neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    entrypoint: ["/bin/bash", "/seed.sh"]
    network_mode: "service:neo4j"

  backend:
    build: ./backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      MYSQL_CONNECTION: "server=mysql;port=3306;user=root;password=${MYSQL_ROOT_PASSWORD:-rootpass};database=${MYSQL_DATABASE:-word_games}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "password"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "5238:5238"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5238/api"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
  neo4j_data:
