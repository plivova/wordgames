services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-word_games}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    healthcheck:
      test: ["CMD", "mysql", "-u", "root", "-prootpass", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_CONNECTION: "server=mysql;port=3306;user=root;password=${MYSQL_ROOT_PASSWORD:-rootpass};database=${MYSQL_DATABASE:-word_games}"
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "5238:5238"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:5238/api"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mysql_data:
